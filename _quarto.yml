lang: es
citeproc: true
bibliography: references.bib

project:
  type: book
  output-dir: docs

website:
  reader-mode: true
  search:
    location: sidebar
    type: overlay
  comments:
    hypothesis:
      openSidebar: true
      theme: clean

execute: 
  freeze: auto

book:
  title: "Fitted Q-Iteration: Estimación de niveles de presas"
  author:
    - name: "Erika Rubí Jiménez Guzmán"
      affiliations:
        - name: "Universidad Autónoma Chiapas"
    
    - name: "Asesor: Dr. Yofre Hernán García Gómez"
      affiliations:
        - name: "Universidad Autónoma de Chiapas"
  language: es
  date: today
  image: Imagenes\FCFMLOGO.png
  favicon: Imagenes\FCFMLOGO.png
  downloads: [pdf, epub]

  sidebar:
    logo: Imagenes\logos.jpeg
    style: floating
    collapse-level: 2
    border: true
    search: true

  repo-url: https://github.com/RubiJimenez929/Tesis-Licenciatura
  page-navigation: true 

  chapters:
    - index.qmd
    - intro.qmd

    - part: "Preliminares"
      chapters:
        - Fundamentos_Matematicos.qmd
        - Fundamentos_Hidraulicos.qmd
      
    - part: "Modelo Matemático"
      chapters:
        - ModeloMatematicoNew.qmd
        - modelo_matematico_fqi_corregido.qmd


    - conclusiones.qmd
    - futuros_trabajos.qmd
    - references.qmd

  comments:
    hypothesis: true 



format:
  html:
    theme:
      light: flatly
      dark: darkly
    highlight-style: a11y
    toc: true
    toc-location: right
    code-fold: true
    code-copy: true
    citation-hover: true

  pdf:
    lang: es
    template-partials:
      - before-body.tex
    include-in-header:
      text: |
        \usepackage{tikz}
        \usetikzlibrary{arrows.meta, positioning, calc}
    documentclass: scrreprt
    hyperref: true
    papersize: letter
    toc: true
    link-citations: true
    number-sections: true
    keep-tex: true
    pdf-engine: xelatex

  epub:
    cover-image: Imagenes\FCFMLOGO.png


editor: visual